name: Secret Scanning

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:

# =========================
# GITLEAKS SCAN
# =========================
  gitleaks-scan:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.result.outputs.found }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          sudo apt update
          sudo apt install gitleaks -y


      - name: Run & Save Gitleaks Output
        if: always()
        run: |
          gitleaks detect  -v --no-git --redact > gitleaks-output.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-output
          path: gitleaks-output.txt
      
      - name: Check gitleaks findings
        id: result
        run: |
          if [ -s gitleaks-output.txt ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

# =========================
# TRUFFLEHOG SCAN
# =========================
  trufflehog-scan:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.result.outputs.found }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Run &  Save TruffleHog Output
        if: always()
        run: |
          docker run --rm \
            -v "$PWD:/pwd" \
            trufflesecurity/trufflehog:latest \
            filesystem --fail --exclude-paths /pwd/.trufflehog-ignore  \
            > trufflehog-output.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-output
          path: trufflehog-output.txt

      - name: Check trufflehog findings
        id: result
        run: |
          if [ -s trufflehog-output.txt ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
  


  Issue-Creation:
    name: Create / Update Secret Scan Issue
    runs-on: ubuntu-latest
    needs: [gitleaks-scan, trufflehog-scan]
  
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
  
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
  
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "🚨 Hard coded Secrets Detected";
            const label = "security:secrets";
  
            const gitleaksFound = "${{ needs.gitleaks-scan.outputs.found }}" === "true";
            const trufflehogFound = "${{ needs.trufflehog-scan.outputs.found }}" === "true";
            const secretsFound = gitleaksFound || trufflehogFound;
  
            const read = (p) =>
              fs.existsSync(p) && fs.statSync(p).size > 0
                ? fs.readFileSync(p, "utf8")
                : "_No findings_";
  
            const body = `
            ### 🚨 Hard coded Secrets Detected
  
            **Branch:** ${context.ref}
            **Commit:** ${context.sha}
  
            ### 🔍 Gitleaks
            ${read("artifacts/gitleaks-output/gitleaks-output.txt")}
  
            ### 🔍 TruffleHog
            ${read("artifacts/trufflehog-output/trufflehog-output.txt")}
  
            🔗 Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}
            `;
  
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label
            });
  
            const existing = issues.data.find(i => i.title === title);
  
            if (!secretsFound) {
              if (existing) {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: "closed"
                });
              }
              return;
            }
  
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: [label]
              });
            }
